<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rezultati, izlaznost i primedbe iz zapisnika biračkih odbora za sva biračka mesta Savskog venca, 2022–2024.">
<style>html{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Biračka mesta Savskog venca</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: tall, document-like dashboard. Sticky tab bar; overview (election chips, KPIs, 37-row bar list, scatter), table, BM detail, comparison, method. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#15212c; --ink2:#4b5966; --ink3:#76828e; --rule:#d9dfe5; --rule2:#e8ecf0;
  --accent:#15212c; --accent-ink:#ffffff; --hover:#eaeff3;
  --opp:#2a78d6; --gov:#eb6834; --unk:#a7b0b9; --warn:#b4540f; --warn-bg:#fbf1e6; --ok:#2f7d4f;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#18222c; --ink:#e8edf1; --ink2:#aab6c1; --ink3:#7f8c98; --rule:#2a3744; --rule2:#212d38;
  --accent:#e8edf1; --accent-ink:#0f161d; --hover:#202c37;
  --opp:#3987e5; --gov:#d95926; --unk:#6b7783; --warn:#e59a5b; --warn-bg:#2b2118; --ok:#58b57c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#18222c; --ink:#e8edf1; --ink2:#aab6c1; --ink3:#7f8c98; --rule:#2a3744; --rule2:#212d38;
  --accent:#e8edf1; --accent-ink:#0f161d; --hover:#202c37;
  --opp:#3987e5; --gov:#d95926; --unk:#6b7783; --warn:#e59a5b; --warn-bg:#2b2118; --ok:#58b57c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
header.top{padding-block:28px 14px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:flex-end;justify-content:space-between}
h1{font-size:clamp(24px,4.4vw,34px);line-height:1.12;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--ink2);max-width:62ch}
.stamp{font:12px var(--mono);color:var(--ink3)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;gap:2px;overflow-x:auto;margin-inline:-16px;padding-inline:16px}
nav.tabs button{font:500 14px var(--sans);color:var(--ink2);background:none;border:0;border-bottom:2px solid transparent;padding:12px 12px 10px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
nav.tabs button:hover{color:var(--ink)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--opp);outline-offset:2px}
section.pane{display:flex;flex-direction:column;gap:22px;padding-top:20px}
h2{font-size:18px;margin:0;font-weight:600}
h3{font-size:15px;margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--ink2)} .small{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--sans);border:1px solid var(--rule);background:var(--surface);color:var(--ink2);border-radius:6px;padding:6px 10px;cursor:pointer}
.chip:hover{background:var(--hover)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font:500 26px/1.2 var(--sans);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:12px;color:var(--ink3);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.two{align-items:start;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
/* bar list */
.rows{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.brow{display:grid;grid-template-columns:44px minmax(0,1fr) 54px;align-items:center;gap:8px;background:none;border:0;padding:2px 4px;border-radius:4px;cursor:pointer;color:var(--ink);text-align:left;font:inherit;width:100%}
.brow:hover,.brow:focus-visible{background:var(--hover)}
.brow .n{font:12px var(--mono);color:var(--ink2)}
.brow .v{font:12px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:2px;height:14px;min-width:0}
.bar span{display:block;height:100%;min-width:1px}
.bar span:first-child{border-radius:2px 0 0 2px}.bar span:last-child{border-radius:0 2px 2px 0}
.flag{color:var(--warn);font-weight:600}
/* table */
.tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
input[type=search],select{font:14px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 200px;max-width:340px}
.tscroll{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--rule2);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child,th.l,td.l{text-align:left}
thead th{font-size:12px;font-weight:500;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;background:var(--surface);position:sticky;top:0}
thead th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
thead th button:focus-visible{outline:2px solid var(--opp);outline-offset:2px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
td.name{white-space:normal;min-width:220px;max-width:340px;text-align:left;color:var(--ink2);font-size:13px}
td.bmn{font:500 13px var(--mono)}
.pill{display:inline-block;font:500 11px var(--sans);border-radius:99px;padding:1px 8px;border:1px solid var(--rule);color:var(--ink2)}
.pill.w{color:var(--warn);border-color:var(--warn)}
/* detail */
.back{all:unset;cursor:pointer;color:var(--ink2);font-size:14px}
.back:hover{color:var(--ink)}
.dhead{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-start;justify-content:space-between}
.dhead h2{font-size:clamp(20px,3.4vw,26px);text-wrap:balance}
.dnav{display:flex;gap:6px}
.callout{background:var(--warn-bg);border:1px solid var(--rule);border-left:3px solid var(--warn);border-radius:6px;padding:10px 14px;font-size:14px}
.callout ul{margin:6px 0 0;padding-left:18px}
ul.list{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.cat{font:500 11px var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin-right:6px}
.cat.INC{color:var(--warn)}
.note{margin-top:12px}
.obs-k{font:500 12px var(--mono);color:var(--ink2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
svg text{font-family:var(--sans)}
.chart{position:relative;min-width:0}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:7px 10px;font-size:12px;line-height:1.45;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none}
.tip b{font-weight:600}
.srcs{font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.srcs li{margin-bottom:5px}
.doc{font:500 12px var(--mono);color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:2px 3px;border-radius:3px}.doc:hover{background:var(--hover)}
.themebtn{font:12px var(--mono);background:none;border:1px solid var(--rule);border-radius:6px;color:var(--ink2);padding:4px 8px;cursor:pointer}
@media(max-width:520px){th,td{padding:7px 9px}.kpi .v{font-size:22px}}
@media(prefers-reduced-motion:no-preference){.bar span{transition:width .25s}}
</style>

</head>

 SVM, SPP/Zukorlić","U vladi i lokalnim vlastima. SPP ima ministra bez portfelja od 2022 (E. Đerlek, zatim U. Zukorlić od 2024)."],["Sateliti","SRS (Šešelj), Ruska stranka (S. Nikolić)","SRS je 2022. podržao Vučića za predsednika, a 2023/2024. na lokalu ide sa SNS. Ruska stranka javno izražava podršku Vučiću i SNS-u (npr. ključni mandat u Nišu 2024)."],["Prešli na stranu vlasti","Zavetnici (2022), Nacionalno okupljanje Zavetnici–Dveri (2023)","Izašli kao opozicija. Lider Zavetnika postaje ministarka u vladi formiranoj maja 2024, a 2024. su na Vučićevoj listi. Dveri ostaju opozicija."],["Opozicija","UZPB/UZPS, Moramo, NADA, Dveri, Suverenisti (2022), Ajmo ljudi/Tadić, SPN, Biramo, Kreni-Promeni, Žujović, Narodna stranka, Narodna lista, DJB, Ćale…, 1 od 5 miliona, Nestorovićeve liste","Nisu u vlasti. Nestorovićeve liste su odbijale saradnju sa obe strane i nisu podržale Šapića."],["Nejasno","Č. Jovanović, Srbija na zapadu, Vacić, manjinske liste bez jasnog stava, „Mi smo narod sa Savskog venca“, „Dosta politike – Savski venac je naš“","Nema dovoljno pouzdanih podataka o stvarnom opredeljenju. „Dosta politike“ je 2024. bila jezičak na vagi za vlast u opštini."]],"cls_note":"Napomena: Zdrava Srbija M. Stamatovića bila je 2022. deo opozicionih Suverenista, a 2024. je na listi „Aleksandar Vučić – Beograd sutra“. Za 2022. je računata kao opozicija.","src":["Vlada M. Vučevića, maj 2024 – M. Đurđević Stamenkovski ministarka: danas.rs/bbc-news-serbian/srbija-i-politika-povratak-loncara-i-vulina-resor-i-za-milicu-zavetnicu-predlozena-nova-vlada; kurir.rs/vesti/politika/4387344","Zavetnici u koaliciji sa Dverima kao opozicija 2023: n1info.rs/vesti/vlada-srbije-milica-djurdjevic-stamenkovski-tatjana-macura","Ministri bez portfelja (SPP): en.wikipedia.org/wiki/Minister_without_portfolio_(Serbia)","Šešelj o podršci Vučiću 2022: naslovi.net/rd/30021870; SRS sa SNS na lokalnim izborima: 021.rs/info/srbija/357163","Ruska stranka i podrška SNS-u: n1info.rs/vesti/ruska-stranka-se-predomislila-ipak-ostaje-uz-sns-u-nisu; slobodnaevropa.org/a/ruska-stranka-srbija-izbori/32980448.html","Nestorović – bez podrške Šapiću: danas.rs/vesti/politika/nestorovic-imamo-informacije-da-je-manojlovic-spreman-na-saradnju-sa-nasim-pokretom…; vreme.com/vesti/mi-glas-iz-naroda-sapic-nas-nije-zvao-na-razgovor","Savski venac 2024 – raspodela mandata: n1info.rs/vesti/malo-poznata-manjinska-lista-kroji-vlast-u-savskom-vencu…; danas.rs/vesti/politika/izbori-savski-venac-grci","Raspisani parlamentarni izbori 25.10.2026: paragraf.rs/dnevne-vesti/100926/100926-vest2.html"]}</script>
<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById('dataj').textContent);
var EK=D.elections.map(function(e){return e.k});
var BMI={};D.bm.forEach(function(b){BMI[b.bm]=b});
var LONGNAME={};D.elections.forEach(function(e){LONGNAME[e.k]=e.short+' ('+e.date+')'});
var state={tab:'pregled',el:'O24',bm:null,sort:{k:'bm',dir:1},q:'',cmp:{a:5,b:24,c:36},metric:'opp',dtab:null};
try{var s=localStorage.getItem('sv_el');if(s&&EK.indexOf(s)>=0)state.el=s}catch(e){}

function fmtN(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function pct(v,d){d=d==null?1:d;return (v*100).toFixed(d).replace('.',',')+'%'}
function pp(v){var x=(v*100);return (x>=0?'+':'−')+Math.abs(x).toFixed(1).replace('.',',')+' p.p.'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(s,r){return (r||document).querySelector(s)}
function el(h){var t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild}

// derived metrics
function shares(e){var G=e.blocs.V+e.blocs.S+e.blocs.P;return{G:G/e.vaz,O:e.blocs.O/e.vaz,N:e.blocs.N/e.vaz}}
function munShares(k){var m=D.mun[k];var G=m.blocs.V+m.blocs.S+m.blocs.P;return{G:G/m.vaz,O:m.blocs.O/m.vaz,N:m.blocs.N/m.vaz}}
function met(e,m){if(m==='turnout')return e.t/e.reg;if(m==='nev')return e.nev/(e.nev+e.vaz);var s=shares(e);return m==='opp'?s.O:s.G}
function metM(k,m){var x=D.mun[k];if(m==='turnout')return x.turnout;if(m==='nev')return x.nev/(x.nev+x.vaz);var s=munShares(k);return m==='opp'?s.O:s.G}
var METL={opp:'Udeo opozicije',gov:'Udeo vlasti sa satelitima i prebeglima',turnout:'Izlaznost',nev:'Udeo nevažećih listića'};
function isOut(b,k){var z=b.el[k]&&b.el[k].z;return z&&Math.max(Math.abs(z.turnout),Math.abs(z.nev),Math.abs(z.opp),Math.abs(z.gov))>=2.5}
function nInc(b){return b.cnt.INC+b.n_rem}

// tooltip
var tip=$('#tip');
function showTip(ev,html){tip.innerHTML=html;tip.style.display='block';var x=ev.clientX+14,y=ev.clientY+14,w=tip.offsetWidth,h=tip.offsetHeight;
  if(x+w>innerWidth-8)x=ev.clientX-w-14;if(y+h>innerHeight-8)y=ev.clientY-h-14;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'}
function hideTip(){tip.style.display='none'}

// router
var TABS=[['pregled','Pregled'],['bm','Biračka mesta'],['poredjenje','Poređenje'],['metod','O podacima']];
function nav(){var n=$('#tabs');n.innerHTML='';TABS.forEach(function(t){var b=el('<button role="tab" type="button" aria-selected="'+(state.tab===t[0])+'">'+t[1]+'</button>');b.onclick=function(){state.tab=t[0];state.bm=null;render();window.scrollTo(0,0)};n.appendChild(b)})}
function go(bm){state.tab='bm';state.bm=bm;state.dtab=null;render();window.scrollTo(0,0)}
function render(){nav();hideTip();var v=$('#view');v.innerHTML='';
  var p=state.tab==='pregled'?pagePregled():state.tab==='bm'?(state.bm?pageDetail(state.bm):pageTable()):state.tab==='poredjenje'?pageCompare():pageMetod();
  v.appendChild(p);
  try{history.replaceState(null,'','#'+(state.bm?'bm-'+state.bm:state.tab))}catch(e){}
  if(p._after)p._after()}

function chipsEl(onpick){var c=el('<div class="chips" role="group" aria-label="Izbori"></div>');D.elections.forEach(function(e){
  var b=el('<button type="button" class="chip" aria-pressed="'+(state.el===e.k)+'">'+esc(e.short)+' <span style="opacity:.6;font-weight:400">'+esc(e.date.replace(/\.$/,''))+'</span></button>');
  b.onclick=function(){state.el=e.k;try{localStorage.setItem('sv_el',e.k)}catch(x){}onpick()};c.appendChild(b)});return c}
function legend(){return '<div class="legend"><span><i style="background:var(--opp)"></i>Opozicija</span><span><i style="background:var(--gov)"></i>Vlast, sateliti i prebegli</span><span><i style="background:var(--unk)"></i>Nejasno</span></div>'}

/* ---------- PREGLED ---------- */
function pagePregled(){
  var k=state.el,m=D.mun[k],ms=munShares(k);
  var rows=D.bm.filter(function(b){return b.el[k]}).map(function(b){var e=b.el[k];return{b:b,e:e,s:shares(e),tr:e.t/e.reg}});
  rows.sort(function(a,c){return c.s.O-a.s.O});
  var nOut=rows.filter(function(r){return isOut(r.b,k)}).length;
  var P=el('<section class="pane"></section>');
  P.appendChild(chipsEl(render));
  P.appendChild(el('<div class="kpis">'
    +'<div class="kpi"><div class="l">Upisani birači</div><div class="v">'+fmtN(m.reg)+'</div><div class="d">'+rows.length+' biračkih mesta</div></div>'
    +'<div class="kpi"><div class="l">Izlaznost</div><div class="v">'+pct(m.turnout)+'</div><div class="d">'+fmtN(m.t)+' birača izašlo</div></div>'
    +'<div class="kpi"><div class="l">Opozicija</div><div class="v" style="color:var(--opp)">'+pct(ms.O)+'</div><div class="d">'+fmtN(m.blocs.O)+' glasova</div></div>'
    +'<div class="kpi"><div class="l">Vlast i sateliti</div><div class="v" style="color:var(--gov)">'+pct(ms.G)+'</div><div class="d">'+fmtN(m.blocs.V+m.blocs.S+m.blocs.P)+' glasova</div></div>'
    +'<div class="kpi"><div class="l">Nevažeći listići</div><div class="v">'+fmtN(m.nev)+'</div><div class="d">'+pct(m.nev/(m.nev+m.vaz))+' izašlih</div></div></div>'.replace('sateliti','sateliti')));
  var two=el('<div class="two"></div>');
  var c1=el('<div class="card"><h3>Raspodela glasova po biračkim mestima</h3><p class="small muted" style="margin:2px 0 8px">Sortirano po udelu opozicije. Kliknite red za detalje.</p></div>');
  c1.appendChild(el(legend()));
  var rs=el('<div class="rows"></div>');
  rows.forEach(function(r){
    var b=el('<button type="button" class="brow" aria-label="Biračko mesto '+r.b.bm+', opozicija '+pct(r.s.O)+'"><span class="n">BM '+r.b.bm+'</span><span class="bar"><span style="width:'+(r.s.O*100)+'%;background:var(--opp)"></span><span style="width:'+(r.s.G*100)+'%;background:var(--gov)"></span>'+(r.s.N>0.002?'<span style="width:'+(r.s.N*100)+'%;background:var(--unk)"></span>':'')+'</span><span class="v">'+pct(r.s.O,0)+(isOut(r.b,k)?' <span class="flag" title="Statističko odstupanje">!</span>':'')+'</span></button>');
    b.onclick=function(){go(r.b.bm)};
    b.onmousemove=function(ev){showTip(ev,'<b>BM '+r.b.bm+'</b> · '+esc(r.b.name)+'<br>Opozicija '+pct(r.s.O)+' · vlast '+pct(r.s.G)+' · nejasno '+pct(r.s.N)+'<br>Izlaznost '+pct(r.tr)+' ('+fmtN(r.e.t)+' od '+fmtN(r.e.reg)+')')};
    b.onmouseleave=hideTip;rs.appendChild(b)});
  c1.appendChild(rs);
  var c2=el('<div class="card" style="display:flex;flex-direction:column;gap:10px"><div><h3>Izlaznost i udeo opozicije</h3><p class="small muted">Svaka tačka je jedno biračko mesto. Prstenom su označena odstupanja veća od 2,5 standardne devijacije (<b>'+nOut+'</b> na ovim izborima).</p></div><div class="chart" id="scat"></div></div>');
  two.appendChild(c1);two.appendChild(c2);P.appendChild(two);
  // outliers + irregularities
  var flagged=rows.filter(function(r){return isOut(r.b,k)});
  var inc=D.bm.slice().sort(function(a,b){return nInc(b)-nInc(a)}).filter(function(b){return nInc(b)>0}).slice(0,8);
  var c3=el('<div class="two"></div>');
  var fh='<div class="card"><h3>Odstupanja na ovim izborima</h3>';
  if(!flagged.length)fh+='<p class="small muted" style="margin-top:6px">Nijedno biračko mesto ne odstupa više od 2,5 standardne devijacije.</p>';
  else{fh+='<ul class="list">';flagged.forEach(function(r){var f=D.bm[0]&&r.b.flags.filter(function(x){return x.k===k});
    fh+='<li><a href="#" data-bm="'+r.b.bm+'" style="color:inherit"><b>BM '+r.b.bm+'</b></a> — '+f.map(function(x){return esc(x.label)+' '+pct(x.val)+' naspram proseka '+pct(x.mean)}).join('; ')+'</li>'});fh+='</ul>'}
  fh+='<p class="small muted" style="margin-top:10px">Odstupanje nije dokaz nepravilnosti. Pokazuje gde ima smisla pogledati zapisnik.</p></div>';
  var ih='<div class="card"><h3>Najviše upisanih primedbi i incidenata</h3><p class="small muted" style="margin:2px 0 0">Zbir primedbi u zapisnicima o radu odbora i primedbi posmatrača, svih sedam izbora.</p><ul class="list">';
  inc.forEach(function(b){ih+='<li><a href="#" data-bm="'+b.bm+'" style="color:inherit"><b>BM '+b.bm+'</b></a> <span class="muted">'+nInc(b)+' stavki</span> · '+esc(shortName(b.name))+'</li>'});ih+='</ul></div>';
  c3.appendChild(el(fh));c3.appendChild(el(ih));P.appendChild(c3);
  P.addEventListener('click',function(ev){var a=ev.target.closest&&ev.target.closest('a[data-bm]');if(a){ev.preventDefault();go(+a.dataset.bm)}});
  P._after=function(){scatter($('#scat'),rows,k)};
  return P}
function shortName(n){return n.length>56?n.slice(0,54)+'…':n}

function scatter(host,rows,k){
  var W=host.clientWidth||320,H=Math.max(260,Math.min(360,W*0.78)),m={l:50,r:10,t:8,b:34};
  var xs=rows.map(function(r){return r.tr}),ys=rows.map(function(r){return r.s.O});
  var x0=Math.floor(Math.min.apply(null,xs)*20)/20-0.0,x1=Math.ceil(Math.max.apply(null,xs)*20)/20,y0=Math.floor(Math.min.apply(null,ys)*10)/10,y1=Math.ceil(Math.max.apply(null,ys)*10)/10;
  if(x1-x0<0.1){x1=x0+0.1}
  function X(v){return m.l+(v-x0)/(x1-x0)*(W-m.l-m.r)}function Y(v){return H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b)}
  var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Dijagram rasipanja izlaznosti i udela opozicije po biračkim mestima">';
  var i,t;for(t=y0;t<=y1+1e-9;t+=0.1){s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="var(--rule2)"/><text x="'+(m.l-6)+'" y="'+(Y(t)+4)+'" text-anchor="end" font-size="11" fill="var(--ink3)">'+Math.round(t*100)+'%</text>'}
  var step=(x1-x0)>0.3?0.1:0.05;for(t=x0;t<=x1+1e-9;t+=step){s+='<text x="'+X(t)+'" y="'+(H-m.b+16)+'" text-anchor="middle" font-size="11" fill="var(--ink3)">'+Math.round(t*100)+'%</text>'}
  s+='<text x="'+((W+m.l)/2)+'" y="'+(H-2)+'" text-anchor="middle" font-size="11" fill="var(--ink2)">izlaznost</text>';
  s+='<text transform="translate(10,'+((H-m.b+m.t)/2)+') rotate(-90)" text-anchor="middle" font-size="11" fill="var(--ink2)">udeo opozicije</text>';
  rows.forEach(function(r,i){var o=isOut(r.b,k);
    s+='<g data-i="'+i+'" tabindex="0" style="cursor:pointer" role="link" aria-label="BM '+r.b.bm+'"><circle cx="'+X(r.tr)+'" cy="'+Y(r.s.O)+'" r="11" fill="transparent"/><circle cx="'+X(r.tr)+'" cy="'+Y(r.s.O)+'" r="'+(o?5:4)+'" fill="var(--opp)" stroke="var(--surface)" stroke-width="2"/>'
     +(o?'<circle cx="'+X(r.tr)+'" cy="'+Y(r.s.O)+'" r="9" fill="none" stroke="var(--warn)" stroke-width="1.5"/><text x="'+(X(r.tr)+12)+'" y="'+(Y(r.s.O)+4)+'" font-size="11" font-weight="600" fill="var(--ink)">BM '+r.b.bm+'</text>':'')+'</g>'});
  s+='</svg>';host.innerHTML=s;
  host.querySelectorAll('g[data-i]').forEach(function(g){var r=rows[+g.dataset.i];
    g.onmousemove=function(ev){showTip(ev,'<b>BM '+r.b.bm+'</b><br>Izlaznost '+pct(r.tr)+'<br>Opozicija '+pct(r.s.O))};g.onmouseleave=hideTip;
    g.onclick=function(){go(r.b.bm)};g.onkeydown=function(ev){if(ev.key==='Enter')go(r.b.bm)}})}

/* ---------- TABELA ---------- */
function pageTable(){
  var k=state.el;var P=el('<section class="pane"></section>');
  P.appendChild(chipsEl(render));
  var tools=el('<div class="tools"><input type="search" id="q" placeholder="Broj BM ili naziv (npr. 24, Ugostiteljska)" aria-label="Pretraga biračkih mesta"><span class="small muted" id="cnt"></span></div>');
  P.appendChild(tools);
  var ts=el('<div class="tscroll"></div>');P.appendChild(ts);
  var cols=[['bm','BM',function(r){return r.b.bm}],['name','Naziv',function(r){return r.b.name}],['reg','Upisano',function(r){return r.e.reg}],['tr','Izlaznost',function(r){return r.e.t/r.e.reg}],
    ['O','Opozicija',function(r){return r.s.O}],['G','Vlast',function(r){return r.s.G}],['nev','Nevažeći',function(r){return r.e.nev/(r.e.nev+r.e.vaz)}],['inc','Primedbe',function(r){return nInc(r.b)}]];
  function draw(){

(function(){var h=(location.hash||'').replace('#','');var m=/^bm-(\d+)$/.exec(h);if(m&&BMI[+m[1]]){state.tab='bm';state.bm=+m[1]}else if(['pregled','bm','poredjenje','metod'].indexOf(h)>=0)state.tab=h})();
var rt,lw=innerWidth;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(innerWidth===lw)return;lw=innerWidth;if(state.tab==='pregled'||state.bm||state.tab==='poredjenje')render()},150)});

})();
